name: hexrun
description: Real-World Territory Conquest Fitness Game
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_database: ^11.0.0
  firebase_storage: ^12.0.0

  # Google Sign In
  google_sign_in: ^6.2.0

  # Maps
  mapbox_maps_flutter: ^2.2.0

  # GPS / Location
  geolocator: ^12.0.0
  flutter_background_service: ^5.0.0

  # H3 Geo-Spatial
  h3_flutter: ^0.6.0

  # Navigation
  go_router: ^14.0.0

  # Utilities
  uuid: ^4.0.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  rxdart: ^0.27.0
  intl: ^0.19.0
  shared_preferences: ^2.2.0
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.3.0
  freezed: ^2.5.0
  json_serializable: ^6.7.0
  build_runner: ^2.4.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
